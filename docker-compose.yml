services:
  vm:
    build:
      context: ./vm
      dockerfile: Dockerfile
    # KVMアクセラレーション用。ホストに /dev/kvm がない環境では
    # この2行を削除してください（TCGエミュレーションにフォールバックします）
    devices:
      - /dev/kvm:/dev/kvm
    ports:
      - "5900:5900"
    environment:
      - VM_MEMORY=4096
      - VM_CPUS=4
      - VM_VNC_PORT=5900
      - VM_IMAGE=/vm/desktop.qcow2
      - CMDLINE_FILE=/vm/cmdline.txt
      - USE_KVM=${USE_KVM:-false}
    volumes:
      - ./vm/desktop.qcow2:/vm/desktop.qcow2
      - ./vm/vmlinuz:/vm/vmlinuz:ro
      - ./vm/initrd.img:/vm/initrd.img:ro
      - ./vm/cmdline.txt:/vm/cmdline.txt:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5900 || exit 1"]
      interval: 10s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - VNC_HOST=vm
      - VNC_PORT=5900
      - PORT=8081
    volumes:
      - ./data:/app/data
      # デバッグ用VM管理（作り直し機能）に必要。不要なら削除可。
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      vm:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped

  websockify:
    build:
      context: ./websockify
      dockerfile: Dockerfile
    command: 0.0.0.0:6080 vm:5900
    ports:
      - "6080:6080"
    restart: unless-stopped
