services:
  # ── 既定の作業環境（軽量コンテナデスクトップ・QEMU不要） ──
  # container プロファイル配下。KVMなし環境で ./scripts/up.sh が起動する。
  # KVMあり環境では vm のみ起動し、こちらは起動しない（1つに絞って軽量化）。
  desktop:
    profiles: ["container"]
    runtime: ${DESKTOP_RUNTIME:-}
    networks: [env_desktop]
    cap_drop: [NET_RAW]
    build:
      context: ./desktop
      dockerfile: Dockerfile
    environment:
      - VNC_GEOMETRY=1280x800
      - VNC_DEPTH=24
    shm_size: 1gb
    mem_limit: ${DESKTOP_MEMORY_MB:-2048}m
    memswap_limit: ${DESKTOP_MEMORY_MB:-2048}m
    cpus: ${DESKTOP_CPUS:-2}
    pids_limit: ${DESKTOP_PIDS_LIMIT:-1024}
    volumes:
      - home_desktop:/home/agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5900 || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  # ── 重いQEMU VM（KVM必須。`/dev/kvm` がないホストでは起動しない） ──
  # 起動には kvm プロファイルが必要: ./scripts/up.sh（自動判定）か
  # docker compose --profile kvm up を使うこと。
  vm:
    profiles: ["kvm"]
    networks: [env_vm]
    cap_drop: [NET_RAW]
    build:
      context: ./vm
      dockerfile: Dockerfile
    # KVMアクセラレーション用（kvmプロファイルでのみ起動するため常時マウント）
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      # auto（既定）: /dev/kvm の有無で自動切替。.envでの指定は不要。
      # 明示指定時はそれに従う（true=必須、false=TCG。TCGは既定で制限）。
      - USE_KVM=${USE_KVM:-auto}
      - ALLOW_TCG_VM=${ALLOW_TCG_VM:-false}
      - VM_MEMORY=4096
      - VM_CPUS=4
      - VM_VNC_PORT=5900
      - VM_BASE_IMAGE=/vm/base.qcow2
      - VM_IMAGE=/vm/instances/default.qcow2
    volumes:
      - type: bind
        source: ./vm/desktop.qcow2
        target: /vm/base.qcow2
        read_only: true
        bind:
          create_host_path: false
      - ./vm/instances:/vm/instances
      - ./vm/sockets:/vm/sockets
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5900 || exit 1"]
      interval: 10s
      retries: 10
      start_period: 60s

  backend:
    networks:
      default:
        gw_priority: 1
        aliases: [backend-management]
    cap_drop: [NET_RAW]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    healthcheck:
      # The API listens only on its management interface, including during upgrades.
      test:
        - CMD
        - python
        - -c
        - |
          import http.client
          conn = http.client.HTTPConnection("backend-management", 8081, timeout=2)
          conn.request("GET", "/health")
          raise SystemExit(conn.getresponse().status != 200)
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    env_file:
      - .env
    environment:
      - VNC_HOST=${VNC_HOST:-desktop}
      - VNC_PORT=5900
      - PORT=8081
      - DESKTOP_RUNTIME=${DESKTOP_RUNTIME:-}
      - DESKTOP_MEMORY_MB=${DESKTOP_MEMORY_MB:-2048}
      - DESKTOP_CPUS=${DESKTOP_CPUS:-2}
      - DESKTOP_PIDS_LIMIT=${DESKTOP_PIDS_LIMIT:-1024}
      - USE_KVM=${USE_KVM:-auto}
      - ALLOW_TCG_VM=${ALLOW_TCG_VM:-false}
    volumes:
      - ./data:/app/data
      - ./vm/sockets:/vm/sockets
      # Android動的払い出しのISO存在確認用（backend内からの参照。Dockerボリューム元はホストパス）。
      - ./vm/overlays:/vm/overlays
      - ./android:/app/android-host:ro
      # デバッグ用VM管理（作り直し機能）に必要。不要なら削除可。
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      desktop:
        condition: service_healthy
        # 初期起動は作業環境を1つに絞る（scripts/up.sh が明示指定）。
        # KVMあり時は desktop が起動対象外のため、依存解決で巻き添え起動しない。
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - |
          const http = require("node:http");
          http.get({hostname: process.env.HOSTNAME, port: 3000, path: "/"}, res => {
            res.resume();
            process.exitCode = res.statusCode === 200 ? 0 : 1;
          }).on("error", () => { process.exitCode = 1; });
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  # ── Android端末（Android-x86 on QEMU。VNC操作は通常VMと同一） ──
  # KVM必須のため kvm プロファイル配下。ISOは android/android-x86_64.iso を配置する。
  # 動的払い出し: POST /vms {"kind": "android"}（KVM必須）
  android:
    profiles: ["kvm"]
    networks: [env_android]
    cap_drop: [NET_RAW]
    build:
      context: ./android
      dockerfile: Dockerfile
    devices:
      - /dev/kvm:/dev/kvm
    environment:
      - ANDROID_ISO=/android/boot.iso
      - ANDROID_MEMORY=2048
      - ANDROID_CPUS=4
      - ANDROID_VNC_PORT=5900
      - USE_KVM=${USE_KVM:-auto}
      - ALLOW_TCG_VM=${ALLOW_TCG_VM:-false}
    volumes:
      - type: bind
        source: ./android/android-x86_64.iso
        target: /android/boot.iso
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./android/kernel
        target: /android/kernel
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./android/initrd.img
        target: /android/initrd.img
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./android/android-data.img
        target: /android/data.img
        bind:
          create_host_path: false
      # APK持ち込み（なければUSBなし。取得は ./scripts/fetch-apks.sh）
      - ./android/apks:/android/apks:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 5900 || exit 1"]
      interval: 10s
      retries: 10
      start_period: 180s

networks:
  default: {}
  env_desktop:
    labels:
      ai-desktop-agent.vm-id: desktop
      ai-desktop-agent.isolated: "true"
  env_vm:
    labels:
      ai-desktop-agent.vm-id: vm
      ai-desktop-agent.isolated: "true"
  env_android:
    labels:
      ai-desktop-agent.vm-id: android
      ai-desktop-agent.isolated: "true"

volumes:
  home_desktop:
    labels:
      ai-desktop-agent.vm-id: desktop
      ai-desktop-agent.workspace: home
