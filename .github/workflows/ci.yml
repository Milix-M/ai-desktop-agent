name: CI

# develop と PR で実行
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

# 同一ブランチの連続push時は前のrunをキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check src/ tests/

  format:
    name: Format (ruff format --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov=ai_desktop_agent --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  frontend:
    name: Frontend (lint, types, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  desktop:
    name: Desktop (real Firefox and VNC)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: docker build -t ai-desktop-agent-desktop-smoke desktop
      - run: docker build -t ai-desktop-agent-backend-smoke .
      - name: Install minimum supported Compose
        env:
          COMPOSE_TEST_DIR: ${{ runner.temp }}/agent-compose
        run: |
          mkdir -p "$COMPOSE_TEST_DIR/cli-plugins"
          curl -fsSL https://github.com/docker/compose/releases/download/v2.33.1/docker-compose-linux-x86_64 -o "$COMPOSE_TEST_DIR/cli-plugins/docker-compose"
          curl -fsSL https://github.com/docker/compose/releases/download/v2.33.1/docker-compose-linux-x86_64.sha256 -o "$COMPOSE_TEST_DIR/checksum"
          digest="$(awk '{print $1}' "$COMPOSE_TEST_DIR/checksum")"
          printf '%s  %s\n' "$digest" "$COMPOSE_TEST_DIR/cli-plugins/docker-compose" | sha256sum --check --status
          chmod +x "$COMPOSE_TEST_DIR/cli-plugins/docker-compose"
          DOCKER_CONFIG="$COMPOSE_TEST_DIR" docker compose version
      - run: uv run pytest -m desktop_integration tests/integration/
        env:
          RUN_DESKTOP_SMOKE: "1"
          DOCKER_CONFIG: ${{ runner.temp }}/agent-compose

  # 全ジョブが通ったことの確認（branch protection用）
  all-checks:
    name: All checks passed
    needs: [lint, format, test, frontend, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.format.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.desktop.result }}" != "success" ]]; then
            echo "Some checks failed"
            exit 1
          fi
          echo "All checks passed"
