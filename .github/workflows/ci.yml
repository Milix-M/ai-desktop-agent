name: CI

# develop・PR・週次で実行
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: "17 21 * * 1"

permissions:
  contents: read

# 同一ブランチの連続push時は前のrunをキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select checks
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select checks from changed paths
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/ci_scope.py select "$BASE_SHA"

  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check src/ tests/ scripts/ci_scope.py

  format:
    name: Format (ruff format --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/ scripts/ci_scope.py

  test:
    name: Test (pytest + coverage)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --frozen --extra mcp

      - name: Run tests with coverage
        run: uv run --frozen --extra mcp pytest -m 'not desktop_integration' --cov=ai_desktop_agent --cov-branch --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  dependencies:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --extra mcp --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Audit known vulnerabilities
        run: uv run pip-audit --strict --require-hashes --disable-pip --requirement "$RUNNER_TEMP/runtime-requirements.txt"

  frontend:
    name: Frontend (lint, types, test, build)
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
        if: needs.changes.outputs.full == 'true'
      - run: npm run typecheck
        if: needs.changes.outputs.full == 'true'
      - run: npm run test:coverage
        if: needs.changes.outputs.full == 'true'
      - run: npm run build
        if: needs.changes.outputs.full == 'true'
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Upload frontend coverage
        if: always() && needs.changes.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  desktop:
    name: Desktop (Firefox, VNC, QMP, and guest agent)
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --frozen
      - name: Set production package refresh date
        id: refresh
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build desktop image
        uses: docker/build-push-action@v6
        with:
          context: desktop
          tags: ai-desktop-agent-desktop-smoke
          build-args: PACKAGE_REFRESH=${{ steps.refresh.outputs.date }}
          load: true
          pull: true
          cache-from: type=gha,scope=desktop-smoke
          cache-to: type=gha,scope=desktop-smoke,mode=max
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ai-desktop-agent-backend-smoke
          build-args: PACKAGE_REFRESH=${{ steps.refresh.outputs.date }}
          load: true
          pull: true
          cache-from: type=gha,scope=backend-smoke
          cache-to: type=gha,scope=backend-smoke,mode=max
      - name: Build QMP image
        uses: docker/build-push-action@v6
        with:
          context: vm
          tags: ai-desktop-agent-qmp-smoke
          build-args: PACKAGE_REFRESH=${{ steps.refresh.outputs.date }}
          load: true
          pull: true
          cache-from: type=gha,scope=qmp-smoke
          cache-to: type=gha,scope=qmp-smoke,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          tags: ai-desktop-agent-frontend-smoke
          build-args: PACKAGE_REFRESH=${{ steps.refresh.outputs.date }}
          load: true
          pull: true
          cache-from: type=gha,scope=frontend-smoke
          cache-to: type=gha,scope=frontend-smoke,mode=max
      - name: Build android image
        uses: docker/build-push-action@v6
        with:
          context: android
          tags: ai-desktop-agent-android-smoke
          build-args: PACKAGE_REFRESH=${{ steps.refresh.outputs.date }}
          load: true
          pull: true
          cache-from: type=gha,scope=android-smoke
          cache-to: type=gha,scope=android-smoke,mode=max
      - name: Build guest-agent image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tests/integration/qga.Dockerfile
          tags: ai-desktop-agent-qga-smoke
          load: true
          pull: true
          cache-from: type=gha,scope=qga-smoke
          cache-to: type=gha,scope=qga-smoke,mode=max
      - name: Install minimum supported Compose
        env:
          COMPOSE_TEST_DIR: ${{ runner.temp }}/agent-compose
        run: |
          mkdir -p "$COMPOSE_TEST_DIR/cli-plugins"
          curl -fsSL https://github.com/docker/compose/releases/download/v2.33.1/docker-compose-linux-x86_64 -o "$COMPOSE_TEST_DIR/cli-plugins/docker-compose"
          curl -fsSL https://github.com/docker/compose/releases/download/v2.33.1/docker-compose-linux-x86_64.sha256 -o "$COMPOSE_TEST_DIR/checksum"
          digest="$(awk '{print $1}' "$COMPOSE_TEST_DIR/checksum")"
          printf '%s  %s\n' "$digest" "$COMPOSE_TEST_DIR/cli-plugins/docker-compose" | sha256sum --check --status
          chmod +x "$COMPOSE_TEST_DIR/cli-plugins/docker-compose"
          DOCKER_CONFIG="$COMPOSE_TEST_DIR" docker compose version
      - name: Check browser availability
        run: google-chrome --version
      - run: uv run --frozen pytest -m desktop_integration tests/integration/ --cov=ai_desktop_agent --cov-branch --cov-report=
        env:
          RUN_DESKTOP_SMOKE: "1"
          DOCKER_CONFIG: ${{ runner.temp }}/agent-compose
          DESKTOP_EVAL_RESULTS_DIR: ${{ runner.temp }}/agent-evaluations
          COVERAGE_FILE: ${{ runner.temp }}/agent-desktop-host.coverage
          DESKTOP_CONTAINER_COVERAGE_DIR: ${{ runner.temp }}/agent-container-coverage
      - name: Combine host and container coverage
        env:
          COVERAGE_FILE: ${{ runner.temp }}/agent-container-coverage/desktop.coverage
        run: |
          uv run --frozen coverage combine --keep "$RUNNER_TEMP/agent-desktop-host.coverage" "$RUNNER_TEMP/agent-container-coverage/container.coverage"
          uv run --frozen coverage xml -o "$RUNNER_TEMP/agent-container-coverage/desktop-coverage.xml"
          uv run --frozen coverage json -o "$RUNNER_TEMP/agent-container-coverage/desktop-coverage.json"
      - name: Upload desktop coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-coverage
          include-hidden-files: true
          path: |
            ${{ runner.temp }}/agent-desktop-host.coverage
            ${{ runner.temp }}/agent-container-coverage/*.json
            ${{ runner.temp }}/agent-container-coverage/*.coverage
            ${{ runner.temp }}/agent-container-coverage/*.xml
            ${{ runner.temp }}/agent-container-coverage/raw/
          retention-days: 7
      - name: Install pinned Trivy
        run: |
          curl -fLSs --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Audit production OS packages
        run: ./scripts/audit-images.sh "$RUNNER_TEMP/os-audit"
      - name: Upload OS audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-audit
          path: ${{ runner.temp }}/os-audit/
          retention-days: 30
      - name: Upload desktop evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evaluation
          path: ${{ runner.temp }}/agent-evaluations/
          retention-days: 7

  # 全ジョブが通ったことの確認（branch protection用）
  all-checks:
    name: All checks passed
    needs: [changes, lint, format, test, dependencies, frontend, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check results
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python scripts/ci_scope.py verify
