name: CI

# develop・PR・週次で実行
on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  schedule:
    - cron: "17 21 * * 1"

permissions:
  contents: read

# 同一ブランチの連続push時は前のrunをキャンセル
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff check
        run: uv run ruff check src/ tests/

  format:
    name: Format (ruff format --check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run ruff format check
        run: uv run ruff format --check src/ tests/

  test:
    name: Test (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov=ai_desktop_agent --cov-report=xml --cov-report=term-missing tests/

      - name: Upload coverage to artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 7

  dependencies:
    name: Runtime dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Export locked runtime dependencies
        run: uv export --frozen --no-dev --no-emit-project --output-file "$RUNNER_TEMP/runtime-requirements.txt"
      - name: Audit known vulnerabilities
        run: uv run pip-audit --strict --require-hashes --disable-pip --requirement "$RUNNER_TEMP/runtime-requirements.txt"

  frontend:
    name: Frontend (lint, types, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  desktop:
    name: Desktop (Firefox, VNC, QMP, and guest agent)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Refresh production images
        run: |
          refresh="$(date -u +%F)"
          docker build --pull --build-arg "PACKAGE_REFRESH=$refresh" -t ai-desktop-agent-desktop-smoke desktop
          docker build --pull --build-arg "PACKAGE_REFRESH=$refresh" -t ai-desktop-agent-backend-smoke .
          docker build --pull --build-arg "PACKAGE_REFRESH=$refresh" -t ai-desktop-agent-qmp-smoke vm
          docker build --pull --build-arg "PACKAGE_REFRESH=$refresh" -t ai-desktop-agent-frontend-smoke frontend
          docker build --pull --build-arg "PACKAGE_REFRESH=$refresh" -t ai-desktop-agent-android-smoke android
      - run: docker build -t ai-desktop-agent-qga-smoke -f tests/integration/qga.Dockerfile .
      - name: Install minimum supported Compose
        env:
          COMPOSE_TEST_DIR: ${{ runner.temp }}/agent-compose
        run: |
          mkdir -p "$COMPOSE_TEST_DIR/cli-plugins"
          curl -fsSL https://github.com/docker/compose/releases/download/v2.33.1/docker-compose-linux-x86_64 -o "$COMPOSE_TEST_DIR/cli-plugins/docker-compose"
          curl -fsSL https://github.com/docker/compose/releases/download/v2.33.1/docker-compose-linux-x86_64.sha256 -o "$COMPOSE_TEST_DIR/checksum"
          digest="$(awk '{print $1}' "$COMPOSE_TEST_DIR/checksum")"
          printf '%s  %s\n' "$digest" "$COMPOSE_TEST_DIR/cli-plugins/docker-compose" | sha256sum --check --status
          chmod +x "$COMPOSE_TEST_DIR/cli-plugins/docker-compose"
          DOCKER_CONFIG="$COMPOSE_TEST_DIR" docker compose version
      - run: uv run pytest -m desktop_integration tests/integration/
        env:
          RUN_DESKTOP_SMOKE: "1"
          DOCKER_CONFIG: ${{ runner.temp }}/agent-compose
          DESKTOP_EVAL_RESULTS_DIR: ${{ runner.temp }}/agent-evaluations
      - name: Install pinned Trivy
        run: |
          curl -fLSs --retry 3 https://github.com/aquasecurity/trivy/releases/download/v0.76.2/trivy_0.76.2_Linux-64bit.tar.gz -o "$RUNNER_TEMP/trivy.tar.gz"
          printf '%s  %s\n' bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf "$RUNNER_TEMP/trivy.tar.gz" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/trivy-bin"
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy-bin" trivy
          echo "$RUNNER_TEMP/trivy-bin" >> "$GITHUB_PATH"
      - name: Audit production OS packages
        run: ./scripts/audit-images.sh "$RUNNER_TEMP/os-audit"
      - name: Upload OS audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: os-audit
          path: ${{ runner.temp }}/os-audit/
          retention-days: 30
      - name: Upload desktop evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-evaluation
          path: ${{ runner.temp }}/agent-evaluations/
          retention-days: 7

  # 全ジョブが通ったことの確認（branch protection用）
  all-checks:
    name: All checks passed
    needs: [lint, format, test, dependencies, frontend, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.lint.result }}" != "success" ]] || \
             [[ "${{ needs.format.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.dependencies.result }}" != "success" ]] || \
             [[ "${{ needs.frontend.result }}" != "success" ]] || \
             [[ "${{ needs.desktop.result }}" != "success" ]]; then
            echo "Some checks failed"
            exit 1
          fi
          echo "All checks passed"
